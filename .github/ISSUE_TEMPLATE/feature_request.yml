name: Feature request
description: Suggest an idea or improvement for DayVault.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need, not just the solution — it helps find the best fit.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: principles
    attributes:
      label: Fit with DayVault
      description: DayVault is offline-first and keeps your data on your device.
      options:
        - label: This works without an internet connection or a server account, or I've explained why it can't.
